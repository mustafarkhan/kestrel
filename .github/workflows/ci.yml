name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m "not slow and not sitl" --cov=kestrel --cov-report=term-missing:skip-covered

  closed-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m slow

  sitl:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARDUPILOT_REF: Copter-4.6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore ArduCopter SITL build
        id: cache
        uses: actions/cache@v4
        with:
          path: ardupilot-sitl
          key: arducopter-sitl-${{ env.ARDUPILOT_REF }}-ubuntu24
      - name: Build ArduCopter SITL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install pexpect future
          # empy 3.3.4 is a single module; vendor it (its setup.py does not build on new setuptools)
          mkdir -p "$RUNNER_TEMP/pylib" "$RUNNER_TEMP/empy"
          pip download --no-deps --no-binary :all: "empy==3.3.4" -d "$RUNNER_TEMP/empy"
          tar xzf "$RUNNER_TEMP"/empy/empy-3.3.4.tar.gz -C "$RUNNER_TEMP/empy"
          cp "$RUNNER_TEMP"/empy/empy-3.3.4/em.py "$RUNNER_TEMP/pylib/"
          export PYTHONPATH="$RUNNER_TEMP/pylib"
          git clone --depth 1 --branch "$ARDUPILOT_REF" https://github.com/ArduPilot/ardupilot.git "$RUNNER_TEMP/ardupilot"
          cd "$RUNNER_TEMP/ardupilot"
          git submodule update --init --depth 1 modules/mavlink modules/waf modules/DroneCAN/libcanard \
            modules/DroneCAN/dronecan_dsdlc modules/DroneCAN/pydronecan modules/DroneCAN/DSDL
          ./waf configure --board sitl
          ./waf copter
          mkdir -p "$GITHUB_WORKSPACE/ardupilot-sitl"
          cp build/sitl/bin/arducopter Tools/autotest/default_params/copter.parm "$GITHUB_WORKSPACE/ardupilot-sitl/"
      - run: pip install -e ".[dev]"
      - name: Fly a mission on ArduCopter SITL
        env:
          ARDUPILOT_SITL: ${{ github.workspace }}/ardupilot-sitl/arducopter
          ARDUPILOT_DEFAULTS: ${{ github.workspace }}/ardupilot-sitl/copter.parm
        run: pytest -m sitl -v
