name: audit

# Known vulnerabilities in the dependencies a fresh install resolves to. Weekly rather than
# on every pull request: a new advisory is not caused by the change under review.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip install ".[camera]"
      - run: pip freeze --exclude kestrel-uas > requirements.lock
      - run: pip-audit -r requirements.lock
