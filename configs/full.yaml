# Everything on: one forward camera, the ground acoustic cueing network and the bird/drone
# classifier. Used by the project video; the benchmark matrix varies one layer at a time.
vehicle:
  mass: 1.6
  battery_wh: 77.0
camera:
  width: 480
  height: 360
  hfov_deg: 75.0
  pitch_up_deg: 8.0
  rate_hz: 10.0
safety:
  min_altitude: 5.0
  max_altitude: 60.0
  max_horizontal_speed: 8.0
  fence_margin: 8.0
  min_separation: 12.0
  energy_reserve_fraction: 0.2
acoustic:
  enabled: true
  node_spacing_m: 100.0
tracker:
  classify_birds: true
